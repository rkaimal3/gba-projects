<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GBA Music Player</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <script>
    EJS_player = "#game";
    EJS_core = "gba";
    EJS_gameName = "GBA Music Player";
    EJS_gameUrl = "./Project.gba";
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

    // Keep native click-to-start behavior so audio initializes correctly.
    EJS_startOnLoaded = false;

    // Use your custom title screen.
    EJS_backgroundImage = "./cover.png";
    EJS_backgroundBlur = false;
    EJS_backgroundColor = "#000";

    // Native EmulatorJS start button.
    EJS_startButtonName = "CLICK TO PLAY";
    EJS_alignStartButton = "center";
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
