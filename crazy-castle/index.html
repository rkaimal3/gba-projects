<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ria's GBA Game</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap {
      width: min(900px, 94vw);
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 18px; opacity: .75; line-height: 1.5; }
    .frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      min-height: 480px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Crazy Castle — Game Boy Advance</h1>
    <p>Designed and programmed by Ria Kaimal. Click inside the emulator before using keyboard controls.</p>
    <div class="frame">
      <div id="game"></div>
    </div>
  </main>

  <script>
    EJS_player = "#game";
    EJS_core = "gba";
    EJS_gameName = "Crazy Castle";
    EJS_gameUrl = "./Project.gba";
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_startOnLoaded = true;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
