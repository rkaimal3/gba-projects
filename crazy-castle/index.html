<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Crazy Castle</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      background: #000;
    }

    #game {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>


<body>

  <div id="game"></div>


  <script>

    EJS_player = "#game";

    EJS_core = "gba";

    EJS_gameName = "Crazy Castle";

    EJS_gameUrl = "./Project.gba";

    EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";


    /*
      Let EmulatorJS handle startup normally.
    */

    EJS_startOnLoaded = false;


    /*
      Use your Crazy Castle cover as the native
      EmulatorJS start screen.
    */

    EJS_backgroundImage = "./cover.png";

    EJS_backgroundBlur = false;

    EJS_startButtonName = "CLICK TO PLAY";


    /*
      PERFORMANCE

      Keep mGBA's conservative idle-loop handling
      so our custom game logic isn't altered.

      Skip one rendered frame between displayed
      frames to reduce browser rendering load.

      This should improve emulation speed without
      using the aggressive CPU-loop detection that
      made the game buggy.
    */

    EJS_defaultOptions = {

      "mgba_idle_optimization": "Remove Known",

      "mgba_frameskip": "1"

    };

  </script>


  <script
    src="https://cdn.emulatorjs.org/stable/data/loader.js">
  </script>


</body>

</html>
