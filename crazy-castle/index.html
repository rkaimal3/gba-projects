<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crazy Castle</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /*
      Keep EmulatorJS's real start button available
      but make it invisible.
    */
    .ejs_start_button {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #cover {
      position: absolute;
      inset: 0;
      z-index: 9999;

      background:
        #000
        url("./cover.png")
        center / contain no-repeat;

      image-rendering: pixelated;
      cursor: pointer;
    }

    #cover::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;

      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.55) 0 1px,
        transparent 1px 4px
      );
    }

    #click-to-play {
      position: absolute;

      /* Approved placement in the orange space */
      top: 78%;
      left: 50%;

      transform: translate(-50%, -50%);
      z-index: 10000;

      color: #fff;
      font-family: "Courier New", Courier, monospace;
      font-weight: 900;
      font-size: clamp(18px, 2.8vw, 32px);

      letter-spacing: 0.1em;
      white-space: nowrap;

      text-shadow:
        3px 3px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000;

      animation: blink 1.05s steps(1, end) infinite;
      pointer-events: none;
    }

    @keyframes blink {
      0%,
      64% {
        opacity: 1;
      }

      65%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #click-to-play {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="game-shell">

    <div id="game"></div>

    <div
      id="cover"
      role="button"
      tabindex="0"
      aria-label="Play Crazy Castle"
    >
      <div id="click-to-play">
        CLICK TO PLAY
      </div>
    </div>

  </div>


  <script>
    /*
      Native EmulatorJS setup.
      Do NOT auto-start.
    */

    EJS_player = "#game";
    EJS_core = "gba";
    EJS_gameName = "Crazy Castle";
    EJS_gameUrl = "./Project.gba";
    EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    EJS_startOnLoaded = false;
    EJS_startButtonName = "CLICK TO PLAY";
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>


  <script>
    const cover =
      document.getElementById("cover");

    let started = false;


    function startGame() {

      if (started) return;

      const nativeButton =
        document.querySelector(".ejs_start_button");


      /*
        EmulatorJS may not have generated its
        start button yet, so wait until it exists.
      */

      if (!nativeButton) {
        setTimeout(startGame, 50);
        return;
      }


      started = true;

      /*
        Trigger EmulatorJS's own startup.
      */

      nativeButton.click();

      /*
        Then remove our custom title screen.
      */

      cover.remove();
    }


    cover.addEventListener(
      "click",
      startGame
    );


    cover.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();
          startGame();
        }
      }
    );
  </script>

</body>
</html>
