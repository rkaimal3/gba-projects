<body>
  <div id="game-shell"><div id="game"></div><div id="cover" role="button" tabindex="0" aria-label="Click to play"><div id="click-to-play">CLICK TO PLAY</div></div></div>

  <script>
    EJS_player = "#game";
    EJS_core = "gba";
    EJS_gameName = "Crazy Castle";
    EJS_gameUrl = "./Project.gba";
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_startOnLoaded = true;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
(function () {
  const cover = document.getElementById("cover");
  if (!cover) return;

  function revealGame() {
    cover.style.display = "none";
  }

  cover.addEventListener("click", revealGame);
  cover.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      revealGame();
    }
  });
})();
</script>
